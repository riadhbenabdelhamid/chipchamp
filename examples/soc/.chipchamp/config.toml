[project]
name = "soc-example"
design_md = ["DESIGN.md"]
default_target = "soc"

[targets.soc]
top = "soc_top"
globs = ["rtl/*.sv", "rtl/gen/*.sv"]
defines = { SIMULATION = "1" }

# Source-of-truth map (SPEC §12.5, FR-PROJ-04): these outputs are generated —
# the agent edits the spec and regenerates; direct edits are refused.
[[generated]]
kind = "regmap"
sources = ["hw/regs/timer.yaml"]
outputs = ["rtl/gen/timer_reg_top.sv", "sw/include/timer_regs.h", "docs/gen/timer_regs.md"]
generator = "chipchamp regmap hw/regs/timer.yaml"

[tools]
# One adapter per role. (A list is accepted but only its FIRST entry is used.)
sim_inner = "icarus"
lint = "verilator"
synth = "yosys"
lec = "eqy"
formal = "symbiyosys"
# sim_signoff = "questa"   # roles with no default: sim_signoff, sta, cdc, coverage
# dcp = "rapidwright"      # headless checkpoint analysis (fpga.stats / placement / interchange)
# env_modules = { questa = ["questa/2024.3"] }   # `module load` per adapter (farms)
# sta_liberty = "…/sky130_fd_sc_hd__tt_025C_1v80.lib"   # STA inputs when not
# sta_netlist = "…/netlist.v"                           # derived from a job
# sta_sdc = "…/design.sdc"

# Simulation time limits, lowest to highest precedence: these, then
# tests.yaml `defaults.timeout_s`, then a test's own `timeout_s`, then the
# agent's sim.run(timeout_s=) — which can never exceed max_timeout_s.
# sim_timeout_s = 300
# idle_timeout_s = 600     # no output for this long = hung; default: off
# max_timeout_s = 14400    # ceiling on anything the agent asks for

[runner]
kind = "local"           # local | lsf | slurm (farm submission wraps each step)
max_parallel = 4
# queue = "normal"       # farm queue/partition
# resources = "rusage[mem=8000]"
# extra_args = ["-P", "proj"]

[jobs]
# store = "~/shared/chipchamp-runs"   # shared job store (default: .chipchamp/runs)
# cache = true                        # reuse identical lint/sim verdicts
# Steps inherit the environment minus anything that looks like a credential
# (*_API_KEY, *_TOKEN, *_SECRET*, *_PASSWORD, AWS_*, ANTHROPIC_*, OPENAI_* ...),
# so license servers, vendor roots, MODULEPATH and nix devshells keep working
# while farm submissions never forward a model key. Tighten or go hermetic:
# env_deny = ["MY_INTERNAL_*"]          # extra patterns to drop
# env_allowlist = ["*_LICENSE_FILE", "XILINX*", "NIX_*", "MODULE*"]  # strict mode
# license_wait_s = 600   # max queue time for a [licenses] seat (default: wait)

[context]
deny = ["pdk/**", "**/*.lic"]   # never read into model context (IP/PDK)
# allow = ["pdk/README.md"]      # exceptions to deny

[budgets.default]
v3_submissions_per_task = 8   # heavy jobs (regression, FPGA, RTL-to-GDSII) per task
license_hours = 24
cpu_hours = 200               # reported in budget snapshots; not enforced
model_tokens = 5000000

[agent.guards]
# Loop guards, tuned on headless campaigns. require_report_done is unset:
# headless runs (-p, wake, subagents) must end on report.done; interactive
# turns may end in prose. Set true/false to force it either way.
max_narration_nudges = 3     # "that is a plan, not an action" nudges per run
verify_every_n_writes = 3    # N writes with no lint/sim -> teach to verify now
progress_guard_after = 2     # idle turns on a green, unchanged tree -> next step

# Agent skills (SPEC §15.3): expert playbooks in SKILL.md format. Directories
# here are versioned team intent; `chipchamp skills add <dir>` registers ad-hoc
# ones (persisted in .chipchamp/skills.json). index controls the system-prompt
# index (bodies always load on demand via skill.use):
#   semantic (default) — embed each skill's "Use when…" prose once (cached in
#     .chipchamp/skills.vec.json; `chipchamp skills reindex` prebuilds) and put
#     only the top_k most relevant skills in the prompt for each task, ranked
#     by a local /v1/embeddings endpoint (LM Studio/Ollama/vLLM auto-detected;
#     an explicit skill-name mention always wins). Falls back to compact when
#     no embedding endpoint is reachable.
#   compact — name + first sentence for every skill on every call
#   full — whole descriptions (most tokens) · off — no index
#
# [skills]
# index = "semantic"
# dirs = ["~/skills"]
# embed_provider = ""   # blank = auto-probe local providers
# embed_model = ""      # blank = first model id containing "embed"
# top_k = 5
# min_score = 0.25

# IP component library (SPEC §12): point at a manifest.json library with
# `chipchamp library add <dir>` (persisted in .chipchamp/library.json), or list
# dirs here. `lib.match` finds components by FUNCTION + INTERFACE (name-
# independent) using the same local /v1/embeddings endpoint as skills — embed
# each component once (cached in .chipchamp/library.vec.json; `chipchamp library
# reindex` prebuilds) and cosine-rank + interface-score the agent's described
# sub-block against it; falls back to lexical + interface scoring with no
# endpoint. `library match "<behavior>" --interface "<ports/protocol>"` from
# the shell.
#
# [library]
# dirs = ["~/rtllib-pillars"]
# index = "semantic"    # semantic | lexical
# embed_provider = ""   # blank = auto-probe (same endpoint as skills)
# embed_model = ""      # blank = first model id containing "embed"
# top_k = 6
# min_score = 0.2

# Model layer is provider-agnostic (SPEC §14). By default the model is chosen via
# `chipchamp model`, env (CHIPCHAMP_PROVIDER/CHIPCHAMP_MODEL), or ANTHROPIC/OPENAI keys.
# Built-in providers: anthropic, openai, lmstudio, ollama, vllm, llamacpp.
# Uncomment to pin a default for this workspace:
#
# [model]
# provider = "ollama"        # any built-in or custom [providers.*] name
# model = "qwen3.5:9b"       # blank -> the provider's default
# request_timeout = 600      # total wall-clock budget per model call, seconds
#                            # (also CHIPCHAMP_MODEL_TIMEOUT env; a slow/wedged
#                            #  model times out cleanly instead of hanging)
# max_tokens = 16384         # output cap per call
# reasoning_effort = "low"   # for models that take one (see [model.effort_support])
# context_chars = 0          # transcript budget before compaction (0 = never evict)
# tool_disclosure = true     # progressive tool disclosure (default: on for local servers)
# [model.routing]            # role -> provider:model (planner / subagent / summarizer / bulk)
# subagent = "ollama:qwen3.5:9b"
#
# Example custom OpenAI-compatible endpoint (e.g. an in-house/on-prem gateway):
# [providers.corp]
# kind = "openai"
# base_url = "https://llm.corp.internal/v1"
# api_key_env = "CORP_LLM_KEY"   # or api_key = "…" (prefer the env var)
# default_model = "llama-3.1-70b-instruct"
# local = false                  # true: no key needed, probed for discovery
# extra_headers = { X-Team = "rtl" }
#
# Other sections the code reads:
# [web]              provider / api_key_env / base_url / timeout — the research tool
# [riscv]            declaring this table marks the workspace as a RISC-V core;
#                    toolchain / riscof_config / arch_test point at the toolchain
# [efpga-fabulous]   project = "…"  — the fabric project dir for the eFPGA tools
# [fpga]             max_utilization = 0.8

# External tools over the Model Context Protocol (stdio). Put machine-specific
# servers in .chipchamp/config.local.toml (ignored by git, merged over this
# file); a server whose command or script is missing is skipped with a
# warning at session start instead of stalling the handshake.
# [mcp.servers.<name>]
# command = "<program> <args>"

[ui]
# lime-phosphor CRT theme, matching the status bar (unset = rich defaults)
theme = "phosphor"
# mcp_images = true     # render image blocks returned by MCP tools inline
# chip_fill = "▓"       # glyph for the chip banner's fill

[model.effort_support]
# qwen3.8 is a hybrid-thinking generation: ollama accepts reasoning_effort
"qwen3\\.8" = ["low", "medium", "high"]
