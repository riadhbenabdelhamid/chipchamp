# autonomy.<glob>.max is enforced (what the agent may do unattended per path).
# `approvers` and the `approvals` block are informational — who should sign —
# and are not read by the engine.
autonomy:
  default: L1
  "rtl/soc_top.sv": { max: L1, approvers: [dana, sam] }
  "docs/**": { max: L3 }
  "tb/**": { max: L2 }

protected:
  - ".chipchamp/policy.yaml"
  - "waivers/**"

approvals:
  waivers: [sam]
  coverage_exclusions: [dana, sam]
